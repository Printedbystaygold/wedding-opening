<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Wedding Invitation</title>

  <!-- =================================
       FACEBOOK / MESSENGER PREVIEW
       ================================= -->

<meta
property="og:type"
content="website"

>

<meta
property="og:title"
content="Wedding Invitation"

>

<meta
property="og:description"
content="You are cordially invited."

>

<meta
property="og:image"
content="https://printedbystaygold.github.io/wedding-opening/preview.jpg"

>

<meta
property="og:image:width"
content="1200"

>

<meta
property="og:image:height"
content="630"

>

<meta
property="og:url"
content="https://printedbystaygold.github.io/wedding-opening/"

>

  <style>

    /* =================================
       BASIC PAGE
       ================================= */

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f5f0e8;

    }


    /* =================================
       OPENING EXPERIENCE
       ================================= */

    #opening {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #f5f0e8;

      z-index: 1;

    }


    /* =================================
       ENVELOPE VIDEO
       ================================= */

    #envelopeVideo {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 100vw;
      height: auto;

      transform:
        translate(-50%, -50%);

      display: block;

      cursor: pointer;

      z-index: 1;

    }


    /* =================================
       TAP TO OPEN
       ================================= */

    #tapText {

      position: fixed;

      left: 50%;

      bottom: 8%;

      transform:
        translateX(-50%);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 12px;

      letter-spacing: 2px;

      color: #4e4039;

      white-space: nowrap;

      pointer-events: none;

      z-index: 5;

      transition:
        opacity 0.5s ease;

    }


    /* =================================
       LUXURY TRANSITION
       ================================= */

    #transitionScreen {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: #f5f0e8;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      opacity: 0;

      visibility: hidden;

      z-index: 50;

      transition:
        opacity 1.1s ease,
        visibility 1.1s ease;

    }


    /* =================================
       CORDIALLY INVITED
       ================================= */

    #cordially {

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: clamp(
        22px,
        5vw,
        42px
      );

      font-weight: normal;

      letter-spacing: 4px;

      color: #4e4039;

      text-align: center;

      opacity: 0;

      transform:
        translateY(12px);

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;

    }


    /* =================================
       SMALL DECORATIVE LINE
       ================================= */

    #transitionLine {

      width: 45px;

      height: 1px;

      background: #9b8c7d;

      margin-top: 24px;

      opacity: 0;

      transform:
        scaleX(0);

      transition:
        opacity 1s ease,
        transform 1s ease;

    }


    /* =================================
       MOBILE PORTRAIT
       ================================= */

    @media screen
    and (max-width: 699px)
    and (orientation: portrait) {

      #envelopeVideo {

        width: auto;

        height: 115vh;

        left: 50%;

        top: 50%;

        transform:
          translate(-50%, -50%);

      }


      #tapText {

        bottom: 6%;

      }

    }


    /* =================================
       SMALL PHONES
       ================================= */

    @media screen
    and (max-width: 400px)
    and (orientation: portrait) {

      #envelopeVideo {

        height: 120vh;

      }

    }


    /* =================================
       IPAD PORTRAIT
       ================================= */

    @media screen
    and (min-width: 700px)
    and (max-width: 1200px)
    and (orientation: portrait) {

      #envelopeVideo {

        width: auto;

        height: 160vh;

        left: 50%;

        top: 50%;

        transform:
          translate(-50%, -50%);

      }

    }


    /* =================================
       LANDSCAPE
       ================================= */

    @media screen
    and (orientation: landscape) {

      #envelopeVideo {

        width: 100vw;

        height: auto;

      }

    }

  </style>

</head>

<body>

  <!-- =================================
       ENVELOPE OPENING
       ================================= -->

  <main id="opening">

```
<video
  id="envelopeVideo"
  muted
  playsinline
  webkit-playsinline
  preload="auto"
>

  <source
    src="./opening-envelope.mp4"
    type="video/mp4"
  >

</video>


<div id="tapText">

  Tap to open

</div>
```

  </main>

  <!-- =================================
       LUXURY TRANSITION
       ================================= -->

  <section id="transitionScreen">

```
<div id="cordially">

  Cordially Invited

</div>


<div id="transitionLine"></div>
```

  </section>

  <script>

    /* =================================
       ELEMENTS
       ================================= */

    const video =
      document.getElementById(
        "envelopeVideo"
      );

    const tapText =
      document.getElementById(
        "tapText"
      );

    const transitionScreen =
      document.getElementById(
        "transitionScreen"
      );

    const cordially =
      document.getElementById(
        "cordially"
      );

    const transitionLine =
      document.getElementById(
        "transitionLine"
      );


    /* =================================
       WEDDING WEBSITE
       ================================= */

    const weddingWebsite =
      "https://printedbystaygold.com/demo-vintage-minimalist";


    let opened = false;

    let transitioning = false;


    /* =================================
       INITIAL VIDEO STATE
       ================================= */

    video.pause();


    video.addEventListener(
      "loadedmetadata",
      function () {

        video.currentTime = 0;

      }
    );


    /* =================================
       OPEN INVITATION
       ================================= */

    function openInvitation() {

      if (opened) return;

      opened = true;

      tapText.style.opacity = "0";

      video.currentTime = 0;


      video.play()

        .then(function () {

          console.log(
            "Wedding opening started."
          );

        })

        .catch(function(error) {

          console.log(
            "Video playback error:",
            error
          );

          opened = false;

          tapText.style.opacity = "1";

        });

    }


    /* =================================
       DESKTOP CLICK
       ================================= */

    video.addEventListener(
      "click",
      function () {

        openInvitation();

      }
    );


    /* =================================
       MOBILE TOUCH
       ================================= */

    video.addEventListener(
      "touchend",
      function(event) {

        event.preventDefault();

        openInvitation();

      },
      {
        passive: false
      }
    );


    /* =================================
       VIDEO FINISHED
       ================================= */

    video.addEventListener(
      "ended",
      function() {

        if (transitioning) return;

        transitioning = true;


        /*
          Briefly hold the final
          envelope frame.
        */

        setTimeout(
          function() {


            /*
              Show ivory transition.
            */

            transitionScreen.style.visibility =
              "visible";

            transitionScreen.style.opacity =
              "1";


            /*
              Reveal Cordially Invited.
            */

            setTimeout(
              function() {

                cordially.style.opacity =
                  "1";

                cordially.style.transform =
                  "translateY(0)";


                transitionLine.style.opacity =
                  "1";

                transitionLine.style.transform =
                  "scaleX(1)";

              },
              300
            );


            /*
              Give the words a brief
              elegant moment.
            */

            setTimeout(
              function() {

                window.location.replace(
                  weddingWebsite
                );

              },
              1900
            );


          },
          150
        );

      }
    );

  </script>

</body>

</html>
