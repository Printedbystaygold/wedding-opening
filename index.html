<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

  <title>Wedding Invitation</title>

  <!-- =================================
       SOCIAL MEDIA PREVIEW
       ================================= -->

<meta
property="og:type"
content="website"

>

<meta
property="og:title"
content="Wedding Invitation"

>

<meta
property="og:description"
content="You are cordially invited."

>

<meta
property="og:image"
content="https://printedbystaygold.github.io/wedding-opening/preview.jpg"

>

property="og:image:width"
content="1200"

>

  <style>

    /* ================================
       PAGE
       ================================ */

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #f5f0e8;

    }


    /* ================================
       OPENING
       ================================ */

    #opening {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background: #f5f0e8;

      opacity: 1;

      transition:
        opacity 0.8s ease;

    }


    /* ================================
       VIDEO
       ================================ */

    #envelopeVideo {

      position: fixed;

      left: 50%;
      top: 50%;

      width: 100vw;
      height: auto;

      transform:
        translate(-50%, -50%);

      display: block;

      cursor: pointer;

    }


    /* ================================
       TAP TEXT
       ================================ */

    #tapText {

      position: fixed;

      left: 50%;
      bottom: 8%;

      transform:
        translateX(-50%);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 12px;

      letter-spacing: 2px;

      color: #4e4039;

      pointer-events: none;

      white-space: nowrap;

      transition:
        opacity 0.4s ease;

    }


    /* ================================
       TRANSITION COVER
       ================================ */

    #transitionCover {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #f5f0e8;

      opacity: 0;

      pointer-events: none;

      z-index: 20;

      transition:
        opacity 0.9s ease;

    }


    /* ================================
       MOBILE
       ================================ */

    @media screen
    and (max-width: 699px)
    and (orientation: portrait) {

      #envelopeVideo {

        width: auto;

        height: 115vh;

        left: 50%;
        top: 50%;

        transform:
          translate(-50%, -50%);

      }


      #tapText {

        bottom: 6%;

      }

    }


    /* ================================
       SMALL PHONES
       ================================ */

    @media screen
    and (max-width: 400px)
    and (orientation: portrait) {

      #envelopeVideo {

        height: 120vh;

      }

    }


    /* ================================
       IPAD PORTRAIT
       ================================ */

    @media screen
    and (min-width: 700px)
    and (max-width: 1200px)
    and (orientation: portrait) {

      #envelopeVideo {

        width: auto;

        height: 160vh;

        left: 50%;
        top: 50%;

        transform:
          translate(-50%, -50%);

      }

    }


    /* ================================
       LANDSCAPE
       ================================ */

    @media screen
    and (orientation: landscape) {

      #envelopeVideo {

        width: 100vw;

        height: auto;

      }

    }

  </style>

</head>

<body>

  <!-- =================================
       OPENING EXPERIENCE
       ================================= -->

  <main id="opening">

```
<!-- VIDEO -->

<video
  id="envelopeVideo"
  muted
  playsinline
  webkit-playsinline
  preload="auto"
>

  <source
    src="./opening-envelope.mp4"
    type="video/mp4"
  >

</video>


<!-- TAP TEXT -->

<div id="tapText">
  Tap to open
</div>
```

  </main>

  <!-- =================================
       TRANSITION COVER
       ================================= -->

  <div id="transitionCover"></div>

  <script>

    const video =
      document.getElementById(
        "envelopeVideo"
      );

    const tapText =
      document.getElementById(
        "tapText"
      );

    const opening =
      document.getElementById(
        "opening"
      );

    const transitionCover =
      document.getElementById(
        "transitionCover"
      );


    /* ================================
       WEDDING WEBSITE
       ================================ */

    const weddingWebsite =
      "https://printedbystaygold.com/demo-vintage-minimalist";


    let opened = false;
    let transitioning = false;


    /* ================================
       INITIAL FRAME
       ================================ */

    video.pause();


    video.addEventListener(
      "loadedmetadata",
      function () {

        video.currentTime = 0;

      }
    );


    /* ================================
       OPEN INVITATION
       ================================ */

    function openInvitation() {

      if (opened) return;

      opened = true;

      tapText.style.opacity = "0";

      video.currentTime = 0;

      video.play()
        .catch(function(error) {

          console.log(
            "Video playback error:",
            error
          );

          opened = false;

          tapText.style.opacity = "1";

        });

    }


    /* ================================
       CLICK
       ================================ */

    video.addEventListener(
      "click",
      function () {

        openInvitation();

      }
    );


    /* ================================
       MOBILE TOUCH
       ================================ */

    video.addEventListener(
      "touchend",
      function(event) {

        event.preventDefault();

        openInvitation();

      },
      {
        passive: false
      }
    );


    /* ================================
       VIDEO FINISHED
       ================================ */

    video.addEventListener(
      "ended",
      function() {

        if (transitioning) return;

        transitioning = true;


        /*
          Keep the final frame visible
          briefly before transitioning.
        */

        setTimeout(
          function() {

            /*
              Fade the opening experience
              gently into ivory.
            */

            transitionCover.style.opacity = "1";


            /*
              Wait for the fade to complete,
              then open the wedding website.
            */

            setTimeout(
              function() {

                window.location.replace(
                  weddingWebsite
                );

              },
              850
            );

          },
          150
        );

      }
    );


  </script>

</body>

</html>
