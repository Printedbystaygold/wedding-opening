<style>

/* =================================
   BASIC
================================= */

html,
body {

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#f5f0e8;

}


/* =================================
   OPENING
================================= */

#opening {

position:fixed;

inset:0;

width:100vw;
height:100vh;

overflow:hidden;

background:#f5f0e8;

}


/* =================================
   VIDEO
================================= */

#envelopeVideo {

position:fixed;

left:50%;
top:50%;

width:100vw;
height:auto;

transform:
translate(-50%,-50%);

display:block;

cursor:pointer;

z-index:1;

}


/* =================================
   TAP TEXT
================================= */

#tapText {

position:fixed;

left:50%;

bottom:8%;

transform:
translateX(-50%);

font-family:
Georgia,
"Times New Roman",
serif;

font-size:12px;

letter-spacing:2px;

color:#4a3028;

white-space:nowrap;

pointer-events:none;

z-index:5;

transition:
opacity .6s ease;

}


/* =================================
   CORDIALLY INVITED
   OVER VIDEO
================================= */

#cordiallyOverlay {

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

z-index:10;

pointer-events:none;

opacity:0;

transition:
opacity 1.4s ease;

}


/* =================================
   CORDIALLY TEXT
================================= */

#cordially {

font-family:
Georgia,
"Times New Roman",
serif;

font-size:
clamp(24px,5vw,44px);

font-weight:normal;

letter-spacing:5px;

color:#f5f0e8;

text-align:center;

text-shadow:
0 1px 10px rgba(0,0,0,.22);

white-space:nowrap;

}


/* =================================
   DECORATIVE LINE
================================= */

#cordiallyLine {

width:50px;

height:1px;

background:#f5f0e8;

margin-top:22px;

opacity:0;

transform:
scaleX(0);

transition:
opacity 1s ease,
transform 1s ease;

}


/* =================================
   FINAL FADE
================================= */

#finalFade {

position:fixed;

inset:0;

background:#f5f0e8;

z-index:20;

opacity:0;

pointer-events:none;

transition:
opacity .9s ease;

}


/* =================================
   MOBILE
================================= */

@media screen
and (max-width:699px)
and (orientation:portrait) {

#envelopeVideo {

width:auto;

height:115vh;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}

#tapText {

bottom:6%;

}

}


/* =================================
   SMALL PHONES
================================= */

@media screen
and (max-width:400px)
and (orientation:portrait) {

#envelopeVideo {

height:120vh;

}

}


/* =================================
   IPAD PORTRAIT
================================= */

@media screen
and (min-width:700px)
and (max-width:1200px)
and (orientation:portrait) {

#envelopeVideo {

width:auto;

height:160vh;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}

}


/* =================================
   LANDSCAPE
================================= */

@media screen
and (orientation:landscape) {

#envelopeVideo {

width:100vw;

height:auto;

}

}

</style>

</head>


<body>


<!-- =================================
     ENVELOPE VIDEO
================================= -->

<main id="opening">

<video
id="envelopeVideo"
muted
playsinline
webkit-playsinline
preload="auto"
>

<source
src="./opening-envelope.mp4"
type="video/mp4"
>

</video>


<div id="tapText">

Tap to open

</div>

</main>


<!-- =================================
     CORDIALLY INVITED
================================= -->

<div id="cordiallyOverlay">

<div id="cordially">

Cordially Invited

</div>

<div id="cordiallyLine"></div>

</div>


<!-- =================================
     FINAL FADE
================================= -->

<div id="finalFade"></div>


<script>

/* =================================
   ELEMENTS
================================= */

const video =
document.getElementById(
"envelopeVideo"
);

const tapText =
document.getElementById(
"tapText"
);

const cordiallyOverlay =
document.getElementById(
"cordiallyOverlay"
);

const cordiallyLine =
document.getElementById(
"cordiallyLine"
);

const finalFade =
document.getElementById(
"finalFade"
);


/* =================================
   CANVA WEDDING WEBSITE
================================= */

const weddingWebsite =
"https://printedbystaygold.com/demo-vintage-minimalist";


let opened = false;

let transitioning = false;

let textStarted = false;


/* =================================
   INITIAL STATE
================================= */

video.pause();


video.addEventListener(
"loadedmetadata",
function() {

video.currentTime = 0;

});


/* =================================
   OPEN INVITATION
================================= */

function openInvitation() {

if (opened) return;

opened = true;

tapText.style.opacity = "0";

video.currentTime = 0;

video.play()

.catch(function(error) {

console.log(
"Video playback error:",
error
);

opened = false;

tapText.style.opacity = "1";

});

}


/* =================================
   CLICK ANYWHERE ON VIDEO
================================= */

video.addEventListener(
"click",
function() {

openInvitation();

});


/* =================================
   MOBILE TOUCH
================================= */

video.addEventListener(
"touchend",
function(event) {

event.preventDefault();

openInvitation();

},
{
passive:false
}
);


/* =================================
   CORDIALLY INVITED
   APPEARS BEFORE VIDEO ENDS
================================= */

video.addEventListener(
"timeupdate",
function() {

if (!opened) return;

if (textStarted) return;


/*
   Start approximately
   2 seconds before
   the video finishes.
*/

if (
video.duration &&
video.currentTime >=
video.duration - 2
) {

textStarted = true;


/*
   Fade in Cordially Invited
   while the envelope animation
   is still playing.
*/

cordiallyOverlay.style.opacity =
"1";


/*
   Decorative line follows.
*/

setTimeout(
function() {

cordiallyLine.style.opacity =
"1";

cordiallyLine.style.transform =
"scaleX(1)";

},
500
);

}

});


/* =================================
   VIDEO FINISHED
================================= */

video.addEventListener(
"ended",
function() {

if (transitioning) return;

transitioning = true;


/*
   Very short hold after
   Cordially Invited is visible.
*/

setTimeout(
function() {


/*
   Fade to ivory.
*/

finalFade.style.opacity =
"1";


/*
   Redirect to the actual
   wedding website.
*/

setTimeout(
function() {

window.location.replace(
weddingWebsite
);

},
900
);


},
400
);

});


</script>

</body>

</html>
