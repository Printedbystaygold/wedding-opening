<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Wedding Invitation</title>

<!-- =================================
     FACEBOOK / MESSENGER PREVIEW
================================= -->

<meta
property="og:type"
content="website"

>

<meta
property="og:title"
content="Wedding Invitation"

>

<meta
property="og:description"
content="You are cordially invited."

>

<meta
property="og:image"
content="https://printedbystaygold.github.io/wedding-opening/preview.jpg"

>

<meta
property="og:image:width"
content="1200"

>

<meta
property="og:image:height"
content="630"

>

<meta
property="og:url"
content="https://printedbystaygold.github.io/wedding-opening/"

>

<style>

/* =================================
   BASIC
================================= */

html,
body {

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#f5f0e8;

}


/* =================================
   OPENING
================================= */

#opening {

position:fixed;

inset:0;

width:100vw;
height:100vh;

overflow:hidden;

background:#f5f0e8;

}


/* =================================
   VIDEO
================================= */

#envelopeVideo {

position:fixed;

left:50%;
top:50%;

width:100vw;
height:auto;

transform:
translate(-50%,-50%);

display:block;

cursor:pointer;

z-index:1;

}


/* =================================
   TAP TEXT
================================= */

#tapText {

position:fixed;

left:50%;

bottom:8%;

transform:
translateX(-50%);

font-family:
Georgia,
"Times New Roman",
serif;

font-size:12px;

letter-spacing:2px;

color:#4e4039;

white-space:nowrap;

pointer-events:none;

z-index:5;

transition:
opacity .6s ease;

}


/* =================================
   CORDIALLY INVITED
   OVER VIDEO
================================= */

#cordiallyOverlay {

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

z-index:10;

pointer-events:none;

opacity:0;

transition:
opacity 1.5s ease;

}


/* =================================
   TEXT
================================= */

#cordially {

font-family:
Georgia,
"Times New Roman",
serif;

font-size:
clamp(24px,5vw,44px);

font-weight:normal;

letter-spacing:5px;

color:#f5f0e8;

text-align:center;

text-shadow:
0 1px 8px rgba(0,0,0,.18);

white-space:nowrap;

}


/* =================================
   DECORATIVE LINE
================================= */

#cordiallyLine {

width:50px;

height:1px;

background:#f5f0e8;

margin-top:24px;

opacity:0;

transform:
scaleX(0);

transition:
opacity 1s ease,
transform 1s ease;

}


/* =================================
   FINAL IVORY FADE
================================= */

#finalFade {

position:fixed;

inset:0;

background:#f5f0e8;

z-index:20;

opacity:0;

pointer-events:none;

transition:
opacity 1.2s ease;

}


/* =================================
   MOBILE
================================= */

@media screen
and (max-width:699px)
and (orientation:portrait) {

#envelopeVideo {

width:auto;

height:115vh;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}

#tapText {

bottom:6%;

}

}


/* =================================
   SMALL PHONES
================================= */

@media screen
and (max-width:400px)
and (orientation:portrait) {

#envelopeVideo {

height:120vh;

}

}


/* =================================
   IPAD PORTRAIT
================================= */

@media screen
and (min-width:700px)
and (max-width:1200px)
and (orientation:portrait) {

#envelopeVideo {

width:auto;

height:160vh;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

}

}


/* =================================
   LANDSCAPE
================================= */

@media screen
and (orientation:landscape) {

#envelopeVideo {

width:100vw;

height:auto;

}

}

</style>

</head>

<body>

<!-- =================================
     ENVELOPE
================================= -->

<main id="opening">

<video
id="envelopeVideo"
muted
playsinline
webkit-playsinline
preload="auto"

>

<source
src="./opening-envelope.mp4"
type="video/mp4"

>

</video>

<div id="tapText">

Tap to open

</div>

</main>

<!-- =================================
     CORDIALLY INVITED OVER VIDEO
================================= -->

<div id="cordiallyOverlay">

<div id="cordially">

Cordially Invited

</div>

<div id="cordiallyLine"></div>

</div>

<!-- =================================
     FINAL FADE
================================= -->

<div id="finalFade"></div>

<script>

/* =================================
   ELEMENTS
================================= */

const video =
document.getElementById(
"envelopeVideo"
);

const tapText =
document.getElementById(
"tapText"
);

const cordiallyOverlay =
document.getElementById(
"cordiallyOverlay"
);

const cordiallyLine =
document.getElementById(
"cordiallyLine"
);

const finalFade =
document.getElementById(
"finalFade"
);


/* =================================
   CANVA WEBSITE
================================= */

const weddingWebsite =
"https://printedbystaygold.com/demo-vintage-minimalist";


let opened = false;

let transitioning = false;


/* =================================
   INITIAL STATE
================================= */

video.pause();


video.addEventListener(
"loadedmetadata",
function() {

video.currentTime = 0;

});


/* =================================
   OPEN INVITATION
================================= */

function openInvitation() {

if (opened) return;

opened = true;

tapText.style.opacity = "0";

video.currentTime = 0;

video.play()

.catch(function(error) {

console.log(
"Video playback error:",
error
);

opened = false;

tapText.style.opacity = "1";

});

}


/* =================================
   CLICK
================================= */

video.addEventListener(
"click",
function() {

openInvitation();

});


/* =================================
   MOBILE TOUCH
================================= */

video.addEventListener(
"touchend",
function(event) {

event.preventDefault();

openInvitation();

},
{
passive:false
}
);


/* =================================
   VIDEO END
================================= */

video.addEventListener(
"ended",
function() {

if (transitioning) return;

transitioning = true;


/*
   VIDEO HAS FULLY FINISHED.

   NOW SHOW CORDIALLY INVITED
   OVER THE FINAL VIDEO FRAME.
*/

cordiallyOverlay.style.opacity = "1";


/*
   Decorative line appears
   slightly after the text.
*/

setTimeout(function() {

cordiallyLine.style.opacity = "1";

cordiallyLine.style.transform =
"scaleX(1)";

},500);


/*
   Keep the final frame + text
   visible briefly.
*/

setTimeout(function() {


/*
   Fade everything to ivory.
*/

finalFade.style.opacity = "1";


/*
   Give the fade time to complete,
   then open Canva.
*/

setTimeout(function() {

window.location.replace(
weddingWebsite
);

},1200);


},1900);


});


</script>

</body>

</html>
